---

- name: Configure test server 
  hosts: test
  become: true
  gather_facts: yes
  vars:
    use_iran_mirror: true

  roles:
    - common
    - nginx
    - docker

- name: configure production server
  hosts: production
  become: true
  gather_facts: yes
  vars:
    use_iran_mirror: false

  roles:
    - common
    - nginx
    - role: docker
      tags:
        - docker
