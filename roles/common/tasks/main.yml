---
- name: Backup original sources.list
  copy:
    src: /etc/apt/sources.list
    dest: /etc/apt/sources.list.bak
    remote_src: yes
    force: no

- name: Change Debian mirrors to Shatel mirror
  copy:
    dest: /etc/apt/sources.list
    content: |
      deb http://mirror.shatel.ir/debian bookworm main contrib non-free non-free-firmware
      deb http://mirror.shatel.ir/debian bookworm-updates main contrib non-free non-free-firmware
      deb http://mirror.shatel.ir/debian-security bookworm-security main contrib non-free non-free-firmware
  when: ansible_distribution == "Debian"

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - ca-certificates
      - gnupg
      - python3-pip
    state: present
